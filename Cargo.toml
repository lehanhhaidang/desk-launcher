[workspace]
resolver = "2"
members = [
  "apps/launcher/src-tauri",
  "crates/launcher-paths",
  "crates/launcher-backup",
  "modules/myssh/rust",
  "modules/open-sesame/rust",
  "modules/comtor/rust",
  "modules/video-downloader/rust",
  "modules/md-converter/rust",
  "modules/ai-session-viewer/rust",
  # Add new modules' rust crates here as they come online.
]

[workspace.package]
edition = "2021"
rust-version = "1.77.2"
authors = ["lehanhhaidang"]

[workspace.dependencies]
tauri = { version = "2.10.0", features = [] }
tauri-build = { version = "2.5.4", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
anyhow = "1.0"
thiserror = "1.0"

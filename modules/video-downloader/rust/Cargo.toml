[package]
name = "tauri-plugin-video-downloader"
version = "0.1.0"
edition.workspace = true
description = "Media Toolbox plugin — Capture (yt-dlp), Images (image crate), Videos (ffmpeg). Crate name retained for backwards compatibility."
authors.workspace = true
links = "tauri-plugin-video-downloader"

[lib]
name = "tauri_plugin_video_downloader"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { workspace = true }
tauri-plugin-shell = "2"
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync", "process", "io-util", "rt-multi-thread", "macros"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }

launcher-paths = { path = "../../../crates/launcher-paths" }

[package]
name = "tauri-plugin-open-sesame"
version = "0.1.0"
edition.workspace = true
description = "Open Sesame module — documentation management & git sync. Plugin-ized from the original open-sesame Tauri app."
authors.workspace = true
links = "tauri-plugin-open-sesame"

[lib]
name = "tauri_plugin_open_sesame"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
git2 = "0.19"
notify = "6"
reqwest = { version = "0.12", features = ["json"] }
oauth2 = "4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
dirs = "5"
sha2 = "0.10"
async-trait = "0.1"
keyring = "2"

launcher-paths = { path = "../../../crates/launcher-paths" }

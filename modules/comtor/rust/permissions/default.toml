# Default permission set for the comtor plugin — grants every command.
# Per-command permissions are auto-generated by build.rs (via
# `tauri_plugin::Builder::new(COMMANDS).build()`) under
# `permissions/autogenerated/commands/<cmd>.toml`.
# Identifiers are kebab-case versions of the Rust command names.

"$schema" = "schemas/schema.json"

[default]
description = "Allows every Comtor plugin command."
permissions = [
    # projects
    "allow-list-projects",
    "allow-get-project",
    "allow-create-project",
    "allow-update-project",
    "allow-delete-project",
    # meetings
    "allow-list-meetings",
    "allow-list-recent-meetings",
    "allow-get-meeting",
    "allow-create-meeting",
    "allow-update-meeting",
    "allow-delete-meeting",
    "allow-save-transcript",
    # audio
    "allow-save-audio",
    "allow-get-audio",
    "allow-delete-audio",
    "allow-audio-exists",
    # settings
    "allow-get-settings",
    "allow-get-soniox-key",
    "allow-get-openai-key",
    "allow-set-soniox-key",
    "allow-set-openai-key",
    "allow-clear-soniox-key",
    "allow-clear-openai-key",
    "allow-get-prefs",
    "allow-set-prefs",
    # export
    "allow-export-xlsx",
]

[package]
name = "tauri-plugin-port-killer"
version = "0.1.0"
edition.workspace = true
description = "Port Killer module — list and kill listening ports natively in Rust. SSH tunneling deferred (will use russh once needed)."
authors.workspace = true
links = "tauri-plugin-port-killer"

[lib]
name = "tauri_plugin_port_killer"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }

netstat2 = "0.11"
sysinfo = "0.32"

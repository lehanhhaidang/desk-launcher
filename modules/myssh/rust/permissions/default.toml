"$schema" = "schemas/schema.json"

[default]
description = "Allows every MySSH plugin command."
permissions = [
    "allow-list-hosts",
    "allow-create-host",
    "allow-update-host",
    "allow-delete-host",
    "allow-list-groups",
    "allow-create-group",
    "allow-delete-group",
    "allow-open-session",
    "allow-send-input",
    "allow-resize-session",
    "allow-close-session",
    "allow-list-snippets",
    "allow-create-snippet",
    "allow-update-snippet",
    "allow-delete-snippet",
    "allow-list-forwards",
    "allow-create-forward",
    "allow-delete-forward",
    "allow-start-forward",
    "allow-stop-forward",
]

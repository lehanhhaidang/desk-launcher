"$schema" = "schemas/schema.json"

[default]
description = "Allows every MySSH plugin command."
permissions = [
    "allow-list-hosts",
    "allow-create-host",
    "allow-update-host",
    "allow-delete-host",
    "allow-list-groups",
    "allow-create-group",
    "allow-delete-group",
    "allow-open-session",
    "allow-send-input",
    "allow-resize-session",
    "allow-close-session",
    "allow-list-snippets",
    "allow-create-snippet",
    "allow-update-snippet",
    "allow-delete-snippet",
    "allow-list-forwards",
    "allow-create-forward",
    "allow-delete-forward",
    "allow-start-forward",
    "allow-stop-forward",
    "allow-sftp-open",
    "allow-sftp-list",
    "allow-sftp-download",
    "allow-sftp-upload",
    "allow-sftp-mkdir",
    "allow-sftp-remove",
    "allow-sftp-rename",
    "allow-sftp-close",
]

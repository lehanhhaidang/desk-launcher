[package]
name = "desk-launcher"
version = "0.1.0"
description = "Desk Launcher - unified desktop tool launcher"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[lib]
name = "desk_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true, features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

# Internal shared crates
launcher-paths = { path = "../../../crates/launcher-paths" }

# Modules — crate names follow Tauri's `tauri-plugin-*` convention so the
# permission system auto-strips the prefix; capabilities reference them as
# `comtor:default`, `open-sesame:default`, `port-killer:default`, matching
# the runtime plugin name registered by each crate's `Builder::new(...)`.
tauri-plugin-port-killer       = { path = "../../../modules/port-killer/rust" }
tauri-plugin-open-sesame       = { path = "../../../modules/open-sesame/rust" }
tauri-plugin-comtor            = { path = "../../../modules/comtor/rust" }
tauri-plugin-video-downloader  = { path = "../../../modules/video-downloader/rust" }
